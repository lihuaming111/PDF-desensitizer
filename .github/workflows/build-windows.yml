  name: Build Windows
  on: [push, workflow_dispatch]
  jobs:
    build:
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - run: python ci_build.py
        - uses: actions/upload-artifact@v4
          with:
            name: PDF脱敏工具_Windows
            path: PDF脱敏工具_Windows.zip
