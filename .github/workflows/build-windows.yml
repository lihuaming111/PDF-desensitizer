  name: Build Windows

  on:
    push:
    workflow_dispatch:

  jobs:
    build:
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - name: Install Python dependencies
          run: pip install pyinstaller pymupdf pytesseract Pillow -q
        - name: Download and extract Tesseract
          shell: cmd
          run: |
            curl -L -o tesseract.zip "https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe"
            7z x tesseract.zip -otesseract -y
            curl -L -o tesseract\tessdata\chi_sim.traineddata "https://github.com/tesseract-ocr/tessdata/raw/main/chi_sim.traineddata"
        - name: Build with PyInstaller
          shell: cmd
          run: pyinstaller --onedir --windowed --name=PDF脱敏工具 --distpath=dist --workpath=build_output --noconfirm --clean --add-data=patterns.py;. --add-data=desensitizer.py;.
  --add-binary=tesseract/tesseract.exe;tesseract/ --hidden-import=PIL --hidden-import=PIL.Image --hidden-import=pytesseract --hidden-import=fitz --hidden-import=tkinter main.py
        - name: Bundle
          run: |
            import os, shutil
            os.makedirs("dist/PDF脱敏工具/_internal/tesseract/tessdata", exist_ok=True)
            shutil.copy("tesseract/tessdata/chi_sim.traineddata", "dist/PDF脱敏工具/_internal/tesseract/tessdata/")
            os.makedirs("dist/PDF脱敏工具/input", exist_ok=True)
            os.makedirs("dist/PDF脱敏工具/output", exist_ok=True)
            with open("dist/PDF脱敏工具/启动.bat", "w", encoding="gbk") as f:
                f.write("@echo off\r\n")
                f.write("chcp 65001 >nul\r\n")
                f.write('cd /d "%~dp0"\r\n')
                f.write('set TESSDATA_PREFIX=%~dp0_internal\\tesseract\\tessdata\r\n')
                f.write('set PATH=%~dp0_internal\\tesseract;%PATH%\r\n')
                f.write('start "" "%~dp0PDF脱敏工具.exe"\r\n')
          shell: python
        - name: Zip
          shell: cmd
          run: powershell Compress-Archive -Path dist\PDF脱敏工具\* -DestinationPath PDF脱敏工具_Windows.zip
        - uses: actions/upload-artifact@v4
          with:
            name: PDF脱敏工具_Windows
            path: PDF脱敏工具_Windows.zip
